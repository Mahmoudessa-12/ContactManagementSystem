<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Contact - Contact Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
        }

        .contact-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

            button:hover {
                background-color: #555;
            }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

            .back-link a {
                color: #333;
                text-decoration: none;
                font-weight: bold;
            }

                .back-link a:hover {
                    text-decoration: underline;
                }
    </style>
</head>

<body>

    <div class="container">

        <div class="contact-box">

            <h1>Edit Contact</h1>

            <form method="POST">

                <label for="name">Name</label>

                <input type="text"
                       id="name"
                       name="name"
                       value="{{ contact['name'] }}"
                       required>

                <label for="phone">Phone</label>

                <input type="text"
                       id="phone"
                       name="phone"
                       value="{{ contact['phone'] }}">

                <label for="email">Email</label>

                <input type="email"
                       id="email"
                       name="email"
                       value="{{ contact['email'] }}">

                <label for="address">Address</label>

                <input type="text"
                       id="address"
                       name="address"
                       value="{{ contact['address'] }}">

                <label for="category">Category</label>

                <input type="text"
                       id="category"
                       name="category"
                       value="{{ contact['category'] }}">

                <button type="submit">
                    Update Contact
                </button>

            </form>

            <div class="back-link">
                <a href="/contacts">Back to Contacts</a>
            </div>

        </div>

    </div>

</body>
</html>
