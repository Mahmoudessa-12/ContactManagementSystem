<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Contact Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        .navbar {
            background-color: #333;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .navbar h2 {
                margin: 0;
            }

        .logout {
            color: white;
            text-decoration: none;
            background-color: #555;
            padding: 8px 15px;
            border-radius: 5px;
        }

            .logout:hover {
                background-color: #777;
            }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .welcome {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

            .welcome h1 {
                margin-top: 0;
            }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 200px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

            .card h3 {
                margin-top: 0;
            }

            .card a {
                display: inline-block;
                margin-top: 10px;
                text-decoration: none;
                background-color: #333;
                color: white;
                padding: 10px 15px;
                border-radius: 5px;
            }

                .card a:hover {
                    background-color: #555;
                }
    </style>
</head>

<body>

    <div class="navbar">

        <h2>Contact Management System</h2>

        <a class="logout" href="/logout">Logout</a>

    </div>

    <div class="container">

        <div class="welcome">

            <h1>Welcome, {{ username }}!</h1>

            <p>You are successfully logged in.</p>

            <p>Your role: <strong>{{ role }}</strong></p>

        </div>

        <div class="cards">

            <div class="card">

                <h3>Contacts</h3>

                <p>View and manage your contacts.</p>

                <a href="/contacts">View Contacts</a>

            </div>

            <div class="card">

                <h3>Add Contact</h3>

                <p>Add a new contact to your contact list.</p>

                <a href="/add-contact">Add Contact</a>

            </div>

        </div>

    </div>

</body>
</html>
